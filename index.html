<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日语会話コーチ</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header><div><h1>日语会話コーチ</h1><p>和 AI 聊日语 · 纠错 · 语法 · 动词用法 · 继续对话</p></div><span class="status">练习中</span></header>
<section class="toolbar">
<label>模式 <select id="mode"><option value="daily">日常会话</option><option value="work">职场日语</option><option value="trade">外贸日语</option><option value="interview">面试练习</option></select></label>
<label><input type="checkbox" id="showChinese" checked> 显示中文解释</label>
<button id="clearBtn">清空对话</button>
</section>
<main id="chat"></main>
<section class="panel" id="analysis">
<h2>纠错与讲解</h2><div id="analysisContent">发送一句日语后，这里会显示：<b>哪里错 / 哪里不自然 / 更自然的说法 / 语法 / 动词用法 / 相似表达区别</b>。</div>
</section>
<form id="composer"><textarea id="input" rows="3" placeholder="输入日语，例如：昨日会社に行って、新しい仕事をもらいました。"></textarea><button>发送</button></form>
<footer>第一版支持本地练习；接入 AI API 后即可真正连续对话。</footer>
</div>
<script src="app.js"></script>
</body></html>
